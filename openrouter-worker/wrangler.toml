name = "tania-portfolio-assistant"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
route = "chat.taniaportafolio.workers.dev/*"
zone_id = ""

[[env.production.routes]]
pattern = "chat.taniaportafolio.workers.dev/*"
zone_id = ""

[vars]
ALLOWED_ORIGIN = "*"
OPENROUTER_MODEL = "google/gemini-2.5-flash-lite"
OPENROUTER_SITE_URL = "https://taniaportafolio.vercel.app"
OPENROUTER_SITE_NAME = "Tania Peláez Valverde Portfolio"

[[env.production.vars]]
ALLOWED_ORIGIN = "https://taniaportafolio-hqio.onrender.com"

[triggers]
crons = []
